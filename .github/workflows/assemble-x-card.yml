name: assemble-x-card
on:
  push:
    branches: [main]
    paths:
      - '_parts/**'
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts
        run: |
          python3 -c "from pathlib import Path; ps=sorted(Path('_parts').glob('p*.txt')); Path('x_card.py').write_text(''.join(p.read_text(encoding='utf-8') for p in ps), encoding='utf-8')"
          rm -rf _parts
          git config user.name grokbotx
          git config user.email grokbots@agent.qq.com
          git add -A
          git commit -m "Add x_card.py public fetch/render script"
          git push
